<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Groq Coding AI</title>
<style>
body{
    font-family:Arial;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

textarea{
    width:100%;
    height:200px;
}

pre{
    white-space:pre-wrap;
    border:1px solid #ccc;
    padding:15px;
    margin-top:20px;
}
</style>
</head>
<body>

<h2>Groq Coding AI</h2>

<input
    type="password"
    id="apikey"
    placeholder="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"
    style="width:100%;padding:10px;"
>

<br><br>

<textarea
    id="prompt"
    placeholder="Buatkan EA MT5 XAUUSD..."
></textarea>

<br><br>

<button onclick="generate()">
Generate
</button>

<pre id="result"></pre>

<script>

async function generate(){

    const apiKey =
        document.getElementById("apikey").value;

    const prompt =
        document.getElementById("prompt").value;

    const result =
        document.getElementById("result");

    result.textContent = "Generating...";

    try{

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer "+apiKey
                },
                body:JSON.stringify({
                    model:"llama-3.3-70b-versatile",
                    messages:[
                        {
                            role:"system",
                            content:
`You are a senior software engineer.

Rules:
- Generate complete code
- No pseudocode
- No placeholders
- Production ready
- Bug checked
- Return full source code`
                        },
                        {
                            role:"user",
                            content:prompt
                        }
                    ],
                    temperature:0.2,
                    max_tokens:4096
                })
            }
        );

        const data = await response.json();

        console.log(data);

        if(data.error){
            result.textContent =
                data.error.message;
            return;
        }

        if(data.choices?.length){
            result.textContent =
                data.choices[0].message.content;
        }else{
            result.textContent =
                JSON.stringify(data,null,2);
        }

    }catch(err){
        result.textContent =
            err.toString();
    }
}

</script>

</body>
</html>
